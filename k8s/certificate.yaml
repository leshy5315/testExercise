apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: testwebapp
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-app-tls
  namespace: testwebapp
spec:
  secretName: test-app-tls
  duration: 8760h
  renewBefore: 720h
  subject:
    organizations:
      - test-app
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - test.keruserver-prometheus.site
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
