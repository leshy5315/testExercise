name: Build and deploy

# Build on every push (any branch) and PR; deploy only from main.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IMAGE: leshy5315/test_webapp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PRs only check that the image builds; pushes also publish it
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Helm upgrade on server
        run: |
          ssh root@${{ secrets.SSH_HOST }} bash -s <<'EOF'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd /opt/testExercise
          git fetch --quiet origin main
          git reset --hard ${{ github.sha }}
          kubectl create namespace testwebapp --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install test-app ./charts/test-app -n testwebapp \
            --set image.tag=${{ github.sha }} --wait --timeout 5m
          kubectl get pods -n testwebapp
          EOF

      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 5 https://201.79.12.220.sslip.io/healthz
