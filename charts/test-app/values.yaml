# Default values for test-app

replicaCount: 2

image:
  repository: leshy5315/test_webapp
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: 201.79.12.220.sslip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: test-app-tls
      hosts:
        - 201.79.12.220.sslip.io

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  ENV_NAME: Hello_World

# TLS via cert-manager Issuer + Certificate
#   issuer: selfsigned  - works anywhere (incl. localhost), browser shows a warning
#   issuer: letsencrypt - trusted by browsers; needs a public DNS name and port 80 open
certificate:
  enabled: true
  issuer: letsencrypt
  secretName: test-app-tls
  privateKeySize: 2048
  dnsNames:
    - 201.79.12.220.sslip.io
  # selfsigned only (Let's Encrypt always issues 90-day certs)
  organization: test-app
  duration: 8760h   # 1 year
  renewBefore: 720h # 30 days

letsencrypt:
  email: leshy5315@gmail.com
  # staging: https://acme-staging-v02.api.letsencrypt.org/directory (untrusted, high rate limits)
  server: https://acme-v02.api.letsencrypt.org/directory
