{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "test-app.fullname" . }}-tls
  labels:
    {{- include "test-app.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  {{- if eq .Values.certificate.issuer "selfsigned" }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  subject:
    organizations:
      - {{ .Values.certificate.organization | quote }}
  {{- end }}
  privateKey:
    algorithm: RSA
    size: {{ .Values.certificate.privateKeySize }}
  dnsNames:
    {{- range .Values.certificate.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ include "test-app.fullname" . }}-{{ .Values.certificate.issuer }}
    kind: Issuer
    group: cert-manager.io
{{- end }}
